services:
  postgres:
    image: postgres:15
    container_name: tsp-postgres
    environment:
      POSTGRES_DB: tspdb
      POSTGRES_USER: tspuser
      POSTGRES_PASSWORD: tsppass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tspuser -d tspdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tsp-backend
    ports:
      - "8091:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tspdb
      SPRING_DATASOURCE_USERNAME: tspuser
      SPRING_DATASOURCE_PASSWORD: tsppass
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tsp-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  postgres_data:
