spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tspdb
    username: tspuser
    password: tsppass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
