spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tspdb
    username: tspuser
    password: tsppass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

tsp:
  algorithm:
    population-size: 100
    max-generations: 2000
    mutation-rate: 0.02
    crossover-rate: 0.8
    tournament-size: 5
    progress-interval: 1
